<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>暖暖小時光｜可愛時鐘</title>
<style>
  :root{--ink:#665b68;--pink:#f5b9c8;--cream:#fff9f1;--mint:#c9e8dc;--lav:#ddd5f2}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Nunito","Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 20%,#fff 0 5%,transparent 28%),linear-gradient(135deg,#fce5e9,#fdf3df 52%,#e5f4ec);overflow:hidden}
  .sparkle{position:fixed;color:#fff9d9;font-size:24px;animation:float 5s ease-in-out infinite;pointer-events:none}
  .s1{top:12%;left:13%}.s2{top:20%;right:15%;animation-delay:1s}.s3{bottom:14%;left:19%;animation-delay:2s}.s4{bottom:18%;right:12%;animation-delay:.5s}
  @keyframes float{50%{transform:translateY(-13px) rotate(18deg)}}
  .card{width:min(100%,440px);padding:32px 28px 26px;text-align:center;background:rgba(255,255,255,.78);border:3px solid rgba(255,255,255,.9);border-radius:34px;box-shadow:0 22px 60px #9c829033;backdrop-filter:blur(12px);position:relative}
  .tag{display:inline-block;padding:7px 15px;border-radius:99px;background:#fff0f3;color:#c77e91;font-size:13px;letter-spacing:2px;font-weight:800}
  h1{font-size:25px;margin:13px 0 4px;letter-spacing:2px}.sub{font-size:13px;color:#a99ba7;margin-bottom:22px}
  .clock-wrap{width:min(72vw,270px);aspect-ratio:1;margin:0 auto 22px;position:relative}
  .clock{width:100%;height:100%;border-radius:50%;background:linear-gradient(145deg,#fffdf9,#fff0e9);border:10px solid #f5cbd1;box-shadow:inset 0 0 0 5px #fff,0 12px 25px #c995a344;position:relative}
  .clock:before{content:"";position:absolute;inset:13px;border:2px dashed #efc5c9;border-radius:50%}
  .number{position:absolute;left:50%;top:50%;font-size:19px;font-weight:900;color:#927d8b;width:30px;height:30px;display:grid;place-items:center;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-103px) rotate(calc(-1*var(--a)))}
  .hand{position:absolute;left:50%;bottom:50%;transform-origin:bottom center;border-radius:99px;z-index:3}
  .hour{width:8px;height:65px;background:#8b788d;margin-left:-4px}
  .minute{width:5px;height:91px;background:#e99eae;margin-left:-2.5px}
  .second{width:2px;height:99px;background:#e9a84e;margin-left:-1px}
  .pin{position:absolute;width:17px;height:17px;border-radius:50%;background:#e9a2b2;border:4px solid white;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;box-shadow:0 1px 4px #a77b87}
  .digital{font-size:35px;font-weight:900;letter-spacing:3px;color:#88758e;font-variant-numeric:tabular-nums}
  .date{margin-top:4px;color:#a795a4;font-size:14px}
  .greeting{margin:18px auto 20px;padding:11px 14px;max-width:290px;background:#f3f8f2;border-radius:16px;color:#789487;font-size:14px}
  .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  button{border:0;border-radius:99px;padding:10px 17px;background:#f8dce2;color:#986c7b;font-weight:800;font-size:13px;cursor:pointer;transition:.2s}
  button:hover{transform:translateY(-2px);filter:brightness(.98)}button:focus-visible{outline:3px solid #b9a7d9;outline-offset:3px}
  .footer{margin-top:20px;font-size:11px;color:#b6a8b3;letter-spacing:1px}
  @media(max-width:380px){.card{padding:25px 18px}.number{transform:translate(-50%,-50%) rotate(var(--a)) translateY(-89px) rotate(calc(-1*var(--a)))}.digital{font-size:30px}}
</style>
</head>
<body>
  <span class="sparkle s1">✦</span><span class="sparkle s2">♡</span><span class="sparkle s3">✧</span><span class="sparkle s4">♡</span>
  <main class="card">
    <div class="tag">A LITTLE MOMENT OF JOY</div>
    <h1>暖暖小時光</h1>
    <div class="sub">把每一分每一秒，都過得可可愛愛 ☁️</div>
    <div class="clock-wrap">
      <div class="clock" aria-label="現在時間的類比時鐘">
        <div id="numbers"></div>
        <div class="hand hour" id="hour"></div>
        <div class="hand minute" id="minute"></div>
        <div class="hand second" id="second"></div>
        <div class="pin"></div>
      </div>
    </div>
    <div class="digital" id="digital">00:00:00</div>
    <div class="date" id="date"></div>
    <div class="greeting" id="greeting">今天也要記得對自己溫柔一點 🌷</div>
    <div class="actions">
      <button id="formatBtn" type="button">切換 12 / 24 小時</button>
      <button id="colorBtn" type="button">換個心情 🎨</button>
    </div>
    <div class="footer">SLOW DOWN · BREATHE · ENJOY</div>
  </main>
<script>
  const $ = id => document.getElementById(id);
  const numberBox = $('numbers');
  for(let n=1;n<=12;n++){
    const el=document.createElement('div');el.className='number';el.textContent=n;
    el.style.setProperty('--a',`${n*30}deg`);numberBox.appendChild(el);
  }
  let is24=true, palette=0;
  const palettes=[['#f5cbd1','#fff0e9','#e99eae'],['#c8e5dc','#eff9f2','#83b9a5'],['#d9d1ef','#f3efff','#a998d4'],['#f4d8ae','#fff5df','#d7a65f']];
  const greetings=['今天也要記得對自己溫柔一點 🌷','慢慢來，也是一種前進 ☁️','給自己一個微笑，幸福就靠近了 ♡','願你今天有陽光，也有好心情 ✨'];
  function tick(){
    const now=new Date(),h=now.getHours(),m=now.getMinutes(),s=now.getSeconds(),ms=now.getMilliseconds();
    $('hour').style.transform=`rotate(${(h%12)*30+m*.5+s/120}deg)`;
    $('minute').style.transform=`rotate(${m*6+s*.1}deg)`;
    $('second').style.transform=`rotate(${s*6+ms*.006}deg)`;
    const shown=is24?h:((h%12)||12);
    $('digital').textContent=[shown,m,s].map(v=>String(v).padStart(2,'0')).join(':');
    $('date').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(now);
    $('greeting').textContent=greetings[Math.floor(h/6)%greetings.length];
  }
  $('formatBtn').addEventListener('click',()=>{is24=!is24;tick();$('formatBtn').textContent=is24?'切換 12 / 24 小時':'目前 12 小時制'});
  $('colorBtn').addEventListener('click',()=>{palette=(palette+1)%palettes.length;const p=palettes[palette];document.documentElement.style.setProperty('--pink',p[0]);document.querySelector('.clock').style.borderColor=p[0];document.querySelector('.clock').style.background=`linear-gradient(145deg,#fffdf9,${p[1]})`;document.querySelector('.minute').style.background=p[2];document.querySelector('.pin').style.background=p[2];});
  tick();setInterval(tick,50);
</script>
</body>
</html>
